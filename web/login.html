<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Akuntansi Bisnis Hotel</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>🏨 Hotel Finance</h1>
        <p>Sistem Akuntansi & Keuangan Hotel (USALI)</p>
      </div>

      <div id="alertMessage" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" class="form-control" placeholder="admin@hotel.com" required>
        </div>

        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary">Masuk</button>
      </form>

      <div class="auth-footer">
        Belum memiliki akun? <a href="/register">Daftar sekarang</a>
      </div>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initLoginForm();
    });
  </script>
</body>
</html>
