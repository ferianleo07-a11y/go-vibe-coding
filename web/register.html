<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Hotel - SmarTel: Hotel Property Management System</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 0.5rem;">
        <a href="/" style="display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--gold); font-size: 0.825rem; font-weight: 600;">
          ← Kembali ke Beranda SmarTel
        </a>
      </div>

      <div class="auth-header">
        <div class="brand-crest" style="margin: 0 auto; width: 52px; height: 52px; font-size: 1.5rem; border-radius: var(--radius-sm);">ST</div>
        <h1 style="margin-top: 0.75rem;">SmarTel</h1>
        <p>Registrasi Akun Hotel & Properti Baru</p>
      </div>

      <div id="alertMessage" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Nama Hotel / Entitas Properti</label>
          <input type="text" id="name" class="form-control" placeholder="Contoh: Grand Harmoni Resort, Hotel Citra Indah, dll." required minlength="2">
        </div>

        <div class="form-group">
          <label for="email">Alamat Email Resmi Hotel / Pengelola</label>
          <input type="email" id="email" class="form-control" placeholder="admin@hotelanda.com" required>
        </div>

        <div class="form-group">
          <label for="password">Kata Sandi (Minimal 6 Karakter)</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 0.95rem;">
          Daftarkan Hotel & Mulai Sekarang
        </button>
      </form>

      <div class="auth-footer">
        Sudah memiliki akun pengelola hotel? <a href="/login">Masuk ke sini</a>
      </div>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initRegisterForm();
    });
  </script>
</body>
</html>
